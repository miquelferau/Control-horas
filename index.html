<!doctype html>
<html lang="es">
<head>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta 
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Horas</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;margin:0;color:#111827}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.07)}
.grid,.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{background:#f9fafb;border-radius:14px;padding:14px}
.metric b{display:block;font-size:24px;margin-top:5px}
button{width:100%;padding:17px;border:0;border-radius:14px;font-size:17px;font-weight:700}
.green{background:#16a34a;color:white} .red{background:#dc2626;color:white}
.blue{background:#2563eb;color:white} .gray{background:#e5e7eb;color:#111827}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;box-sizing:border-box}
label{font-size:13px;color:#6b7280}
.status{margin-top:14px;padding:12px;background:#f9fafb;border-radius:12px}
.cloud{font-size:13px;margin-top:8px} .ok{color:#15803d} .bad{color:#b91c1c}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}
.small{padding:8px 10px;width:auto;font-size:13px}
@media(max-width:560px){.grid,.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Control de Horas</h1>
<div style="color:#6b7280;margin-bottom:16px">11,00 €/hora · Sincronizado con Supabase</div>

<div class="card">
<div class="grid">
<div class="metric">Horas del mes<b id="totalHoras">0,00 h</b></div>
<div class="metric">Importe del mes<b id="totalEuros">0,00 €</b></div>
</div>
<div class="grid" style="margin-top:14px">
<button class="green" onclick="registrarEntrada()">🟢 ENTRAR</button>
<button class="red" onclick="registrarSalida()">🔴 SALIR</button>
</div>
<div id="estado" class="status">Cargando...</div>
<div id="cloud" class="cloud">☁️ Conectando...</div>
</div>

<div class="card">
<h3>Añadir manualmente</h3>
<div class="row">
<div><label>Fecha</label><input id="fecha" type="date"></div>
<div><label>Descanso (min)</label><input id="descanso" type="number" value="0"></div>
<div><label>Entrada</label><input id="horaEntrada" type="time"></div>
<div><label>Salida</label><input id="horaSalida" type="time"></div>
</div>
<div style="margin-top:12px"><label>Notas</label><input id="notas" type="text"></div>
<button class="blue" style="margin-top:12px" onclick="guardarManual()">Guardar registro</button>
</div>

<div class="card">
<div class="row">
<div><label>Mes</label><input id="mes" type="month" onchange="render()"></div>
<div style="display:flex;align-items:end"><button class="gray" onclick="exportarCSV()">Exportar Excel/CSV</button></div>
</div>
<button class="gray" style="margin-top:12px" onclick="cargarRegistros()">🔄 Sincronizar</button>
</div>

<div class="card">
<h3>Registros</h3>
<div style="overflow:auto">
<table>
<thead><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Importe</th><th></th></tr></thead>
<tbody id="tabla"></tbody>
</table>
</div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://zcgynioyrrkylduyyykx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yGmuolPMm9OeMkLosr8rBg_aGYMIy0g';
const TABLE = 'registros-horas';
const PRECIO = 11;
let registros = [];

function pad(n){return String(n).padStart(2,"0")}
function hoy(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function ahora(){const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function mesActual(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function abierta(){return registros.find(r=>!r.salida)||null}
function horas(r){
  if(!r.entrada||!r.salida)return 0;
  const a=r.entrada.split(":"), b=r.salida.split(":");
  let m=(+b[0]*60 + +b[1])-(+a[0]*60 + +a[1]);
  if(m<0)m+=1440;
  m-=Number(r.descanso||0);
  return Math.max(0,m/60);
}
function ponerCloud(msg,ok=true){
  const e=document.getElementById("cloud");
  e.textContent=msg;
  e.className="cloud "+(ok?"ok":"bad");
}
async function api(path,opt={}){
  const headers={
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    Accept:"application/json",
    ...(opt.headers||{})
  };
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers});
  const tx=await r.text();
  let data=null;
  if(tx){try{data=JSON.parse(tx)}catch{data=tx}}
  if(!r.ok)throw new Error((data&&data.message)||tx||("HTTP "+r.status));
  return data;
}
async function cargarRegistros(){
  ponerCloud("☁️ Sincronizando...");
  try{
    const data=await api(encodeURIComponent(TABLE)+"?select=*&order=fecha.asc,entrada.asc");
    registros=Array.isArray(data)?data:[];
    localStorage.setItem("horas_cache_v4",JSON.stringify(registros));
    ponerCloud("☁️ Sincronizado con Supabase",true);
  }catch(e){
    try{registros=JSON.parse(localStorage.getItem("horas_cache_v4")||"[]")}catch{registros=[]}
    ponerCloud("⚠️ "+e.message,false);
  }
  render();
}
async function registrarEntrada(){
  if(abierta())return alert("Ya hay una jornada abierta.");
  const nuevo={fecha:hoy(),entrada:ahora(),salida:null,descanso:0,notas:""};
  try{
    await api(encodeURIComponent(TABLE),{
      method:"POST",
      headers:{Prefer:"return=representation"},
      body:JSON.stringify(nuevo)
    });
    await cargarRegistros();
  }catch(e){
    ponerCloud("❌ "+e.message,false);
    alert("No se pudo guardar la entrada. Revisa las políticas RLS.");
  }
}
async function registrarSalida(){
  const r=abierta();
  if(!r)return alert("No hay ninguna entrada abierta.");
  try{
    await api(encodeURIComponent(TABLE)+"?id=eq."+encodeURIComponent(r.id),{
      method:"PATCH",
      body:JSON.stringify({salida:ahora()})
    });
    await cargarRegistros();
  }catch(e){
    ponerCloud("❌ "+e.message,false);
    alert("No se pudo guardar la salida. Revisa las políticas RLS.");
  }
}
async function guardarManual(){
  const f=document.getElementById("fecha").value;
  const e=document.getElementById("horaEntrada").value;
  const s=document.getElementById("horaSalida").value;
  const d=Number(document.getElementById("descanso").value||0);
  const n=document.getElementById("notas").value.trim();
  if(!f||!e||!s)return alert("Completa fecha, entrada y salida.");
  try{
    await api(encodeURIComponent(TABLE),{
      method:"POST",
      body:JSON.stringify({fecha:f,entrada:e,salida:s,descanso:d,notas:n})
    });
    document.getElementById("mes").value=f.slice(0,7);
    document.getElementById("horaEntrada").value="";
    document.getElementById("horaSalida").value="";
    document.getElementById("notas").value="";
    await cargarRegistros();
  }catch(err){
    ponerCloud("❌ "+err.message,false);
    alert("No se pudo guardar el registro. Revisa las políticas RLS.");
  }
}
async function borrarRegistro(id){
  if(!confirm("¿Borrar este registro?"))return;
  try{
    await api(encodeURIComponent(TABLE)+"?id=eq."+encodeURIComponent(id),{method:"DELETE"});
    await cargarRegistros();
  }catch(e){
    alert("No se pudo borrar el registro.");
  }
}
function render(){
  const m=document.getElementById("mes").value;
  const lista=registros.filter(r=>r.fecha&&r.fecha.startsWith(m));
  let total=0,html="";
  lista.forEach(r=>{
    const h=horas(r); total+=h;
    html+=`<tr>
      <td>${r.fecha.split("-").reverse().join("/")}</td>
      <td>${r.entrada||""}</td>
      <td>${r.salida||"Abierta"}</td>
      <td>${h.toFixed(2).replace(".",",")}</td>
      <td>${(h*PRECIO).toFixed(2).replace(".",",")} €</td>
      <td><button class="small gray" onclick="borrarRegistro('${r.id}')">Borrar</button></td>
    </tr>`;
  });
  document.getElementById("tabla").innerHTML=html;
  document.getElementById("totalHoras").textContent=total.toFixed(2).replace(".",",")+" h";
  document.getElementById("totalEuros").textContent=(total*PRECIO).toFixed(2).replace(".",",")+" €";
  const a=abierta();
  document.getElementById("estado").textContent=a?"Jornada abierta desde las "+a.entrada:"No hay jornada abierta.";
}
function exportarCSV(){
  const m=document.getElementById("mes").value;
  const lista=registros.filter(r=>r.fecha&&r.fecha.startsWith(m));
  if(!lista.length)return alert("No hay registros en este mes.");
  let csv="Fecha;Entrada;Salida;Descanso;Horas;Precio/hora;Importe;Notas\n",total=0;
  lista.forEach(r=>{
    const h=horas(r); total+=h;
    csv += `${r.fecha};${r.entrada||""};${r.salida||""};${r.descanso||0};${h.toFixed(2).replace(".",",")};11,00;${(h*11).toFixed(2).replace(".",",")};${(r.notas||"").replaceAll(";"," ")}\n`;
  });
  csv+=`TOTAL;;;;${total.toFixed(2).replace(".",",")};;${(total*11).toFixed(2).replace(".",",")};\n`;
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="Control_horas_"+m+".csv";a.click();URL.revokeObjectURL(u);
}
window.addEventListener("load",()=>{
  document.getElementById("mes").value=mesActual();
  document.getElementById("fecha").value=hoy();
  cargarRegistros();
});
</script>
</body>
</html>
